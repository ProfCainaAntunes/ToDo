name: .NET CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ToDo.slnx

    - name: Build
      run: dotnet build ToDo.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test ToDo.slnx --no-build --configuration Release

    - name: Build Docker Image
      run: docker build -t todo-api-net10 .
